

<div class="fixed z-50 w-full h-16 max-w-lg -translate-x-1/2 bg-white border border-gray-200 rounded-full bottom-4 left-1/2 dark:bg- gray-700 dark:bor der-gray-600">
    <div class="grid h-full max-w-lg grid-cols-5 mx-auto">
        <a [routerLink]="'/dashboard/home'" data-tooltip-target="tooltip-home" class="text-gray-500 hover:text-orange-500 transition hover:bg-orange-50 inline-flex flex-col items-center justify-center px-5 rounded-s-full">
                
            <mat-icon aria-hidden="false" aria-label="home icon" fontIcon="home"></mat-icon>
                <span class="sr-only">Home</span>
        </a>
            <div id="tooltip-home" role="tooltip" class="absolute z-10 invisible inline-block px-3 py-2 font-medium text-white transition-opacity duration-300 bg-gray-900 rounded-lg shadow-xs opacity-0 tooltip dark:bg- gray-700">
                Home
                <div class="tooltip-arrow" data-popper-arrow></div>
            </div>
        <button data-tooltip-target="tooltip-wallet" type="button" class="text-gray-500 hover:text-orange-500 transition hover:bg-orange-50 inline-flex flex-col items-center justify-center px-5 ">
            <mat-icon aria-hidden="false" aria-label="home icon" fontIcon="book"></mat-icon>
            <span class="sr-only">Devotional</span>
        </button>
        <div id="tooltip-wallet" role="tooltip" class="absolute z-10 invisible inline-block px-3 py-2 font-medium text-white transition-opacity duration-300 bg-gray-900 rounded-lg shadow-xs opacity-0 tooltip dark:bg- gray-700">
            Devotional
            <div class="tooltip-arrow" data-popper-arrow></div>
        </div>
        <div class="flex items-center justify-center">
            <a [routerLink]="'/dashboard/add'" data-tooltip-target="tooltip-new" type="button" class="transition inline-flex text-white items-center justify-center w-12 h-12 font-medium bg-orange-600 rounded-full hover:bg-orange-400 focus:ring-4 focus:ring-orange-300 focus:outline-none dark:foc us:ring-orange-800">
                <mat-icon aria-hidden="false" aria-label="home icon" fontIcon="add"></mat-icon>
                <span class="sr-only">New item</span>
            </a>
        </div>
        <div id="tooltip-new" role="tooltip" class="absolute z-10 invisible inline-block px-3 py-2 font-medium text-white transition-opacity duration-300 bg-gray-900 rounded-lg shadow-xs opacity-0 tooltip dark:bg- gray-700">
            Create new item
            <div class="tooltip-arrow" data-popper-arrow></div>
        </div>
        <a [routerLink]="'/dashboard/contacts'"  data-tooltip-target="tooltip-settings" type="button" class="text-gray-500 hover:text-orange-500 transition hover:bg-orange-50 inline-flex flex-col items-center justify-center px-5 ">
            <mat-icon aria-hidden="false" aria-label="home icon" fontIcon="groups"></mat-icon>
            <span class="sr-only">Contacts</span>
        </a>
        <div id="tooltip-settings" role="tooltip" class="absolute z-10 invisible inline-block px-3 py-2 font-medium text-white transition-opacity duration-300 bg-gray-900 rounded-lg shadow-xs opacity-0 tooltip dark:bg- gray-700">
            Contacts
            <div class="tooltip-arrow" data-popper-arrow></div>
        </div>
        <button (click)="signOut()" data-tooltip-target="tooltip-profile" type="button" class="text-gray-500 hover:text-orange-500 transition hover:bg-orange-50 inline-flex flex-col items-center justify-center px-5 rounded-e-full ">
            <mat-icon aria-hidden="false" aria-label="home icon" fontIcon="face"></mat-icon>
            <span class="sr-only">Profile</span>
        </button>
        <div id="tooltip-profile" role="tooltip" class="absolute z-10 invisible inline-block px-3 py-2 font-medium text-white transition-opacity duration-300 bg-gray-900 rounded-lg shadow-xs opacity-0 tooltip dark:bg- gray-700">
            Profile
            <div class="tooltip-arrow" data-popper-arrow></div>
        </div>
    </div>
</div>
