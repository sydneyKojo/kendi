<container>
  <!-- <div class="p-3">
    <img src="/img/bg_2.jpg" class="rounded-3xl m-auto" />

  <div class="flex flex-col justify-between pt-4 px-4 h-full">
    <h1>Your Relationship <br />Energy</h1>
    <h2 class="font-light">
      How do you feel about social interactions?
    </h2>
    <div>
      
<ul class="flex flex-col w-3/4 m-auto gap-6">
    <li>
        <input type="radio" id="hosting-small" name="temperament" (change)="setTemperament('introvert')" value="hosting-small" class="hidden peer" required />
        <label for="hosting-small" class="inline-flex items-left justify-between w-full p-5 text-gr ay-500 bg-white/50 border border-orange-200/70 rounded-2xl cursor-pointer dark:hover:text-gr ay-300 dark:borde r-gray-700 dark:peer-checked:text-orange-500 peer-checked:border-orange-600 dark:peer-checked:borde r-orange-600 peer-checked:text-orange-600 hover:text-gr ay-600 hover:bg-gr ay-100 dark:text-gr ay-400 dark:bg-gr ay-800 dark:hover:bg-gr ay-700">                           
            <div class="block text-left">
                <h4>Introvert</h4>
                <p class="w-full">I love people but need time alone to recharge</p>
            </div>
            <svg class="my-auto w-5 h-5 ms-3 rtl:rotate-180" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 10">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M1 5h12m0 0L9 1m4 4L9 9"/>
            </svg>
        </label>
    </li>
    <li>
        <input type="radio" id="hosting-big" name="temperament" (change)="setTemperament('ambivert')" value="hosting-big" class="hidden peer">
        <label for="hosting-big" class="inline-flex items-left justify-between w-full p-5 text-gr ay-500 bg-white/50 border border-orange-200/70 rounded-2xl cursor-pointer dark:hover:text-gr ay-300 dark:borde r-gray-700 dark:peer-checked:text-orange-500 peer-checked:border-orange-600 dark:peer-checked:borde r-orange-600 peer-checked:text-orange-600 hover:text-gr ay-600 hover:bg-gr ay-100 dark:text-gr ay-400 dark:bg-gr ay-800 dark:hover:bg-gr ay-700">
            <div class="block text-left">
                <h4>Ambivert</h4>
                <p class="w-full">I am balanced</p>
            </div>
            <svg class="my-auto w-5 h-5 ms-3 rtl:rotate-180" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 10">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M1 5h12m0 0L9 1m4 4L9 9"/>
            </svg>
        </label>
    </li>
    <li>
        <input type="radio" id="hosting-bigger" name="temperament" (change)="setTemperament('extrovert')" value="hosting-bigger" class="hidden peer">
        <label for="hosting-bigger" class="inline-flex items-left justify-between w-full p-5 text-gr ay-500 bg-white/50 border border-orange-200/70 rounded-2xl cursor-pointer dark:hover:text-gr ay-300 dark:borde r-gray-700 dark:peer-checked:text-orange-500 peer-checked:border-orange-600 dark:peer-checked:borde r-orange-600 peer-checked:text-orange-600 hover:text-gr ay-600 hover:bg-gr ay-100 dark:text-gr ay-400 dark:bg-gr ay-800 dark:hover:bg-gr ay-700">
            <div class="block text-left">
                <h4>Extrovert</h4>
                <p class="w-full">I thrive around people</p>
            </div>
            <svg class="my-auto w-5 h-5 ms-3 rtl:rotate-180" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 10">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M1 5h12m0 0L9 1m4 4L9 9"/>
            </svg>
        </label>
    </li>
</ul>

    </div>
    <div>
      <!-- <a
        [routerLink]="['/onboarding/faith-journey']"
      > -->
      <cButton (click)="saveProfile()">Continue</cButton>
      <!-- </a>
      <br /> -->
      <!-- <a [routerLink]="['login']" class="font-medium text-sm text-blue-600 dark:text-blue-500"
      >Existing User? Login here</a
    > -->
    </div>
  </div>
</container>
